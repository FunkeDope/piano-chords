# Publishes the site to GitHub Pages on every push to main (and on demand from the Actions tab).
# Requires: Settings -> Pages -> Build and deployment -> Source = "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Pages lets browsers cache files for 10 minutes. Adding ?v=<commit> to every CSS/JS link and
      # module import means a reload always picks up the new version (local copies stay unstamped).
      - name: Stamp file links with this commit
        run: |
          V="${GITHUB_SHA::8}"
          sed -i -E "s#(href|src)=\"((css|js)/[^\"?]+)\"#\1=\"\2?v=$V\"#g" index.html
          sed -i -E "s#from '(\./[^'?]+\.js)'#from '\1?v=$V'#g" js/*.js
          grep -c "?v=$V" index.html js/*.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
